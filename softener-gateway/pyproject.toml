[project]
name = "softener-gateway"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.1",
    "aiomqtt>=2.5.1",
    "click>=8.4.2",
    "cryptography>=49.0.0",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-PyYAML>=6.0.12.20260518",
]

[project.scripts]
softener-gateway = "softener_gateway.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
